# 云盘系统 - pan.aqi125.cn
# 前端：/opt/aipan-llm/vue/dist
# 后端 API：aqicloud-agent:9090 (AqiCloud-Agent)
# AI API：aqicloud-ai:8000 (AqiCloud-AI)

server {
    listen  443 ssl;
    server_name  pan.aqi125.cn;

    # SSL 证书配置（请确认证书文件存在）
    ssl_certificate /opt/aurora/nginx/cert/pan.aqi125.cn_bundle.pem;
    ssl_certificate_key /opt/aurora/nginx/cert/pan.aqi125.cn.key;

    # 访问日志
    access_log /var/log/nginx/pan.access.log;
    error_log /var/log/nginx/pan.error.log;

    # ============================================
    # 前端静态文件
    # ============================================
    location / {
        root   /opt/aipan-llm/vue/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # 缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # AqiCloud-Agent API 代理 (端口 9090)
    # ============================================
    location /api/ {
        proxy_pass http://aqicloud-agent:9090/;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（文件上传需要更长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
        
        # 文件上传大小限制
        client_max_body_size 100m;
    }

    # ============================================
    # AqiCloud-AI API 代理 (端口 8000)
    # ============================================
    location /ai/ {
        proxy_pass http://aqicloud-ai:8000/;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
    }

    # ============================================
    # SSE 流式响应支持（AI 聊天）
    # ============================================
    location /ai/api/chat/stream {
        proxy_pass http://aqicloud-ai:8000/api/chat/stream;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 专用配置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # 超时设置（SSE 需要长时间连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 0;
        proxy_read_timeout 0;
    }

    # ============================================
    # MinIO 文件访问代理
    # ============================================
    location /minio/ {
        proxy_pass http://aurora-minio:9000/;
        
        # 代理头设置
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
    }
}
